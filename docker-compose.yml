services:
  postgres:
    image: postgres:16
    container_name: restoguide-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: restoguide
      POSTGRES_USER: restoguide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoguide -d restoguide"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - restoguide_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: restoguide-api
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "8000:8000"

    depends_on:
      - postgres

volumes:
  restoguide_postgres_data: